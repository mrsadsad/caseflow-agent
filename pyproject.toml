[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caseflow-agent"
version = "0.1.0"
description = "Durable customer-service agent with scoped evidence and idempotent action delivery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
caseflow = "caseflow.__main__:main"

[tool.setuptools.packages.find]
include = ["caseflow*"]

[tool.setuptools.package-data]
caseflow = ["web/*.html"]
